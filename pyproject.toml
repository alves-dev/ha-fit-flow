[project]
name = "ha-fit-flow"
version = "2026.9.2"
description = "Flexible workout management for Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["homeassistant==2026.8.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=7.0", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "PLC", "PLE", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
