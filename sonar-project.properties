sonar.projectKey=ha-fit-flow
sonar.projectName=FitFlow
sonar.projectVersion=2026.9.2

sonar.sources=custom_components/fit_flow
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Branding is binary artwork and the frontend is not measured by the Python coverage report.
sonar.exclusions=custom_components/fit_flow/brand/**,custom_components/fit_flow/frontend/**
sonar.coverage.exclusions=tests/**,custom_components/fit_flow/brand/**,custom_components/fit_flow/frontend/**,custom_components/fit_flow/__init__.py,custom_components/fit_flow/config_flow.py,custom_components/fit_flow/panel.py,custom_components/fit_flow/sensor.py,custom_components/fit_flow/services.py
sonar.qualitygate.wait=true
