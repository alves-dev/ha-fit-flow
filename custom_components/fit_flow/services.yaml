log_activity:
  name: Log activity
  description: Register a configured external physical activity.
  fields:
    activity:
      required: true
      description: Activity ID or configured activity name, for example Corrida.
      selector:
        text:
    datetime:
      required: false
      selector:
        datetime:
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box

check_next_workout:
  name: Check next workout
  description: Recalculate and publish the current workout recommendation.
